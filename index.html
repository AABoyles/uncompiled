<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Content Security Policy
       unsafe-eval is required for embedded page scripts (eval() in index.js).
       unsafe-inline styles are required for Mermaid SVG output.
       connect-src https: allows page scripts to fetch external data sources. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    font-src 'self' https://cdn.jsdelivr.net;
    img-src 'self' data: https:;
    connect-src 'self' https:;
    object-src 'none';
    frame-src 'none';
  ">
  <title></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tufte-css@1.9.0/tufte.min.css" integrity="sha384-Unq5KW28ad1eDFy7/pDgACNgonWWhdG3sAtKrqnhYJKZQ0whjkfn59wmTUNGGtF0" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/styles/default.min.css" integrity="sha384-4Y0nObtF3CbKnh+lpzmAVdAMtQXl+ganWiiv73RcGVdRdfVIya8Cao1C8ZsVRRDz" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css" integrity="sha384-WwGtaC6ywCHxA5cstpj/3+xIZvTez8dq2IcBQaXRkenHZ7FVVq1ZROtURwfbtTlG" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="hidden"></header>
  <main class="hidden">
    <article></article>
  </main>
  <!-- Mermaid: too large to vendor (~3MB); CDN with SRI -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.min.js" integrity="sha384-HHW54r639fK42Ip0coGF3mz8oSiGn0eEoWNTLs75X7H63pLSDBa0Tqs0RwGmLlXE" crossorigin="anonymous"></script>
  <!-- Remaining JS dependencies served from local vendor/ copies -->
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/showdown.min.js"></script>
  <script src="vendor/showdown-tufte.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/katex-auto-render.min.js"></script>
  <script src="index.js"></script>
</body>

</html>
